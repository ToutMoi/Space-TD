const fleetFor = s => waveFleet(s.wave, s.seed, s.respite ? 1 - tune.respite : 1);

// ---- Unique bosses ----------------------------------------------------------------------------

const BOSS_CYCLE = BOSS_ORDER.filter(k => !BOSS[k].final);

const fleetBoss = fleet => BOSS_ORDER.find(t => fleet && fleet[t]) || null;

// ---- Flagship: your own ship, fights beside the defences, comes back repaired each wave ----

    figureLabels() {

      const items = figLabels.map(l => { const p = l.p.clone().applyMatrix4(figGroup.matrixWorld).project(camera); return `<div class="flabel" style="left:${(p.x * 0.5 + 0.5) * viewW}px;top:${(-p.y * 0.5 + 0.5) * viewH}px">${l.name}</div>`; }).join('');
      return `<div class="banner panel" style="top:14px"><b>Les forces en présence</b><small>Tes défenses · la flotte ennemie · les boss</small></div>${items}`;
    },
  };
  return api;
}

// ---- Scenes ------------------------------------------------------------------------------
function openTree(from) { treeFrom = from; scene = 'tree'; hudDirty = true; sfx('click'); }
const scenes = {
  figures: { update(dt) { if (state) state.t += dt; hudDirty = true; }, draw() {} },
  title: {
    update() {
      for (const a of actions.splice(0)) {
        if (a.act === 'newGame') { store(SAVE_KEY, null); reset(); scene = 'play'; hudDirty = true; }
        if (a.act === 'continueGame') { const sv = load(SAVE_KEY); if (sv) resume(sv); else reset(); scene = 'play'; hudDirty = true; }
        if (a.act === 'openTree') openTree('title');
        if (a.act === 'ascUp' || a.act === 'ascDown') { meta.ascSel = Math.max(0, Math.min(meta.ascMax, meta.ascSel + (a.act === 'ascUp' ? 1 : -1))); saveMeta(); hudDirty = true; sfx('click'); }
        if (a.act === 'mute') setMuted(!muted);
      }
      if (scene !== 'title') return;
      if (pressed('KeyT')) { openTree('title'); return; }
      if (pressed('Enter')) { const sv = load(SAVE_KEY); if (sv) resume(sv); else reset(); scene = 'play'; hudDirty = true; }
    },
    draw() {},
  },
  tree: {
    update() {
      for (const a of actions.splice(0)) {
        if (a.act === 'buyNode') buyNode(a.arg);
        if (a.act === 'respec') respec();
        if (a.act === 'closeTree') { scene = treeFrom; hudDirty = true; }
      }
      if (scene === 'tree' && (pressed('Escape') || pressed('KeyT'))) { scene = treeFrom; hudDirty = true; }
    },
    draw() {},
  },
  play: { update(dt) { updatePlay(dt); }, draw() {} },
  stats: { // the game waits while it is open
    update() {
      for (const a of actions.splice(0)) { if (a.act === 'stats' || a.act === 'closeStats') { scene = 'play'; hudDirty = true; } if (a.act === 'mute') setMuted(!muted); }
      if (pressed('KeyI') || pressed('Escape') || pressed('Enter')) { scene = 'play'; hudDirty = true; }
    },
    draw() {},
  },
  pause: {
    update() {
      for (const a of actions.splice(0)) { if (a.act === 'pause') { scene = 'play'; hudDirty = true; } if (a.act === 'mute') setMuted(!muted); }
      if (pressed('Space') || pressed('KeyP') || pressed('Escape') || pressed('Enter')) { scene = 'play'; hudDirty = true; }
    },
    draw() {},
  },
  won: {
    update() {
      for (const a of actions.splice(0)) { if (a.act === 'newGame') { scene = 'title'; hudDirty = true; } if (a.act === 'openTree') openTree('won'); }
      if (scene !== 'won') return;
      if (pressed('KeyT')) { openTree('won'); return; }
      if (pressed('Enter')) { scene = 'title'; hudDirty = true; }
    },
    draw() {},
  },
  over: {
    update() {
      for (const a of actions.splice(0)) { if (a.act === 'newGame') { reset(); scene = 'play'; hudDirty = true; } if (a.act === 'openTree') openTree('over'); }
      if (scene !== 'over') return;
      if (pressed('KeyT')) { openTree('over'); return; }
      if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; hudDirty = true; }
    },
    draw() {},
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
let simTime = 0;
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  const before = scene;
  scenes[scene].update(STEP); hit.clear();
  if (scene !== before) hudDirty = true;
  simTime += STEP; scene3d.update(STEP); tickHud(STEP);
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); scene3d.render(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get meta() { return meta; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

scene = params.get('scene') || 'title';
reset();
scene3d = buildScene3d();
scene3d.onNewGame();
hudDirty = true;
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
